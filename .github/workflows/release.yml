name: Release

run-name: Release ${{ github.ref_name }}

# Publishes the package to npm when a version tag is pushed, once the checks and tests pass, as scraply and sluice release: `v0.2.0` publishes 0.2.0, and package.json keeps 0.0.0 in git. npm trusts this file through trusted publishing (OIDC), so its name stays release.yml: no token is stored, and the package carries provenance. Steps and one-time setup: docs/development.md#releasing.
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # The OIDC token npm exchanges for a publish, and signs provenance with.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node 26.13.0 brings npm 11.20, past the 11.5.1 trusted publishing needs.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          registry-url: https://registry.npmjs.org
          # A release never restores a cache another run could have written.
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check the formatting
        run: bun fmt --check

      - name: Typecheck
        run: bun run check

      # Builds the package from scratch, then tests that build.
      - name: Test
        run: bun run test

      - name: Set the version from the tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # A version already on npm (0.1.0 was published by hand) is left as it is, so a tag can be pushed again.
      - name: Publish, unless this version is on npm already
        run: |
          package="$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')"
          if npm view "$package" version > /dev/null 2>&1; then
            echo "$package is on npm already"
          else
            npm publish --provenance --access public
          fi
