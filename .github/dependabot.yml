version: 2
updates:
  # The pinned actions, by commit SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # astro, typescript, and @types/bun: a new Astro or Bun is tested here before users meet it.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ["*"]
