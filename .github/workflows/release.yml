name: Release

# Publishes the package to npm when a GitHub release is published, from its tag (v and package.json's version), once the checks and tests pass. npm trusts this workflow through trusted publishing (OIDC): no token is stored, and the package carries provenance. One-time setup: docs/development.md#releasing.
on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # The OIDC token npm exchanges for a publish, and signs provenance with.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Check the tag names package.json's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "$TAG" = "v$(node -p 'require("./package.json").version')"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check the formatting
        run: bun fmt --check

      - name: Typecheck
        run: bun run check

      # Builds the package from scratch, then tests that build.
      - name: Test
        run: bun run test

      - name: Publish
        run: npm publish --provenance --access public
