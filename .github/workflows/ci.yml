name: CI

# Installs from the lockfile and checks the formatting, in the pinned Bun image, so a contributor's Bun never decides the result.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and check the formatting
        run: docker run --rm -v "$PWD:/work" -w /work oven/bun:1.4.4-slim sh -c "bun install --frozen-lockfile && bun fmt --check"
